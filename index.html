<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traversal Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a0a; color: #fafafa; }
        .container { text-align: center; max-width: 620px; padding: 2rem; }
        .tag { display: inline-block; background: #1a1a2e; color: #818cf8; padding: 0.35rem 0.9rem; border-radius: 20px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.8rem; }
        h1 { font-size: 2.8rem; font-weight: 700; margin-bottom: 1rem; background: linear-gradient(135deg, #fafafa 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .desc { color: #888; font-size: 1.1rem; line-height: 1.7; margin-bottom: 2.5rem; }
        .contact { color: #555; font-size: 0.9rem; }
        .contact a { color: #818cf8; text-decoration: none; }
        .contact a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tag">Coming Soon</div>
        <h1>Traversal Labs</h1>
        <p class="desc">AI-powered tools for Generative Engine Optimization. Helping businesses get discovered by LLM-based search engines through knowledge graph analysis.</p>
        <p class="contact">Get in touch &mdash; <a href="mailto:saarthak@traversallabs.com">saarthak@traversallabs.com</a></p>
    </div>
</body>
</html>
